[project]
name = "comfyui-poseatlas"
description = "ComfyUI node for RuiC-PoseAtlas: three galleries — 1,439 multi-angle mannequin poses (line art + depth), 1,407 costumes and 1,499 portraits — behind a trilingual (中/EN/日本語) visual picker. No image ships with this repo; run scripts/download_images.py to fetch them (copyright: giaaibusi)."
version = "2.0.0"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# 下载脚本缩深度缩略图时用 Pillow；ComfyUI 自带，独立环境里需要单独装
[project.optional-dependencies]
download = ["Pillow"]

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-PoseAtlas"
Icon = ""
requires-comfyui = ">=0.3.0"

[project.urls]
Repository = "https://github.com/mugicha-AI/ComfyUI-PoseAtlas"
Homepage = "https://github.com/mugicha-AI/ComfyUI-PoseAtlas"
